# Reduced synthetic BBH example inspired by the DINGO literature.
# This configuration trains hnsbi-toolkit's dual hNPE--hNDE model. It does not
# run DINGO and it is not suitable for gravitational-wave data analysis.
schema_version: "2.0"

features:
  - strain_f00_re
  - strain_f00_im
  - strain_f01_re
  - strain_f01_im
  - strain_f02_re
  - strain_f02_im
  - strain_f03_re
  - strain_f03_im
  - strain_f04_re
  - strain_f04_im
  - strain_f05_re
  - strain_f05_im
  - strain_f06_re
  - strain_f06_im
  - strain_f07_re
  - strain_f07_im
  - strain_f08_re
  - strain_f08_im
  - strain_f09_re
  - strain_f09_im
  - strain_f10_re
  - strain_f10_im
  - strain_f11_re
  - strain_f11_im

output_dir: artifacts

bayesian:
  theta_features:
    - chirp_mass_msun
    - mass_ratio
    - phase
    - geocent_time_s
    - luminosity_distance_mpc

  datasets:
    rho:
      kind: parquet
      path: data/rho_posterior_flow.parquet
      event_id_column: simulation_id
      split_column: split
      batch_size: 8192
    rho_residual:
      kind: parquet
      path: data/rho_posterior_residual.parquet
      event_id_column: simulation_id
      split_column: split
      batch_size: 8192
    nu:
      kind: parquet
      path: data/nu_likelihood_flow.parquet
      event_id_column: simulation_id
      split_column: split
      batch_size: 8192
    kappa:
      kind: parquet
      path: data/kappa_likelihood_residual.parquet
      event_id_column: simulation_id
      split_column: split
      batch_size: 8192
    validation:
      kind: parquet
      path: data/independent_validation.parquet
      event_id_column: simulation_id
      batch_size: 8192

  design_distributions:
    rho: &bbh_design
      kind: box_uniform
      low: [22.0, 0.5, -3.141592653589793, -0.02, 500.0]
      high: [45.0, 1.0, 3.141592653589793, 0.02, 1500.0]
    nu: *bbh_design
    kappa: *bbh_design

  posterior_flow:
    architecture: quadratic_spline
    n_coupling_layers: 6
    hidden_features: 128
    hidden_layers: 2
    spline_num_bins: 8
    spline_tail_bound: 4.0
    dropout_probability: 0.0
    training:
      epochs: 60
      batch_size: 512
      learning_rate: 0.0003
      validation_fraction: 0.1
      early_stopping_patience: 10
      seed: 20260731
      device: auto
    onnx_opset: 17

  posterior_ratio:
    backend: native
    ensemble_size: 2
    training:
      epochs: 60
      batch_size: 1024
      learning_rate: 0.0003
      hidden_layers: 3
      neurons: 128
      activation: swish
      validation_fraction: 0.1
      holdout_fraction: 0.1
      early_stopping_patience: 10
      seed: 20260801
    onnx_opset: 17

  likelihood_flow:
    architecture: quadratic_spline
    n_coupling_layers: 6
    hidden_features: 128
    hidden_layers: 2
    spline_num_bins: 8
    spline_tail_bound: 4.0
    dropout_probability: 0.0
    training:
      epochs: 60
      batch_size: 512
      learning_rate: 0.0003
      validation_fraction: 0.1
      early_stopping_patience: 10
      seed: 20260802
      device: auto
    onnx_opset: 17

  likelihood_ratio:
    backend: native
    ensemble_size: 2
    training:
      epochs: 60
      batch_size: 1024
      learning_rate: 0.0003
      hidden_layers: 3
      neurons: 128
      activation: swish
      validation_fraction: 0.1
      holdout_fraction: 0.1
      early_stopping_patience: 10
      seed: 20260803
    normalization: conditional_reference_mean
    onnx_opset: 17

  normalizer:
    reference_draws_per_context: 64
    contexts: 512
    hidden_features: 64
    hidden_layers: 2
    training:
      epochs: 100
      batch_size: 128
      learning_rate: 0.001
      validation_fraction: 0.1
      early_stopping_patience: 12
      seed: 20260804
      device: auto
    onnx_opset: 17

  defensive_epsilon: 0.05
  output_bundle: artifacts/dual_model
